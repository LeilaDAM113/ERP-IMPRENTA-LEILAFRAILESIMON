spring.application.name=ERP-Imprenta

# Puerto en el que arranca el backend. 8080 es el puerto por defecto de Spring
# Boot, lo dejamos explicito para que quede claro y no dependa de valores por
# defecto que podrian cambiar.
server.port=8080

# Carga opcional de un archivo local (ignorado por git) con la contrasena de la BD.
spring.config.import=optional:file:./local.properties,optional:file:./backend/ERP-Imprenta/local.properties

# ===== Conexión a MySQL =====
# createDatabaseIfNotExist=true crea el esquema "sprinta" si aun no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/sprinta?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
# La contrasena se lee de la variable de entorno DB_PASSWORD (NO se guarda en el repo).
# Para arrancar en local: exporta DB_PASSWORD con tu contrasena de MySQL, p.ej.
#   DB_PASSWORD=tu_password ./mvnw spring-boot:run
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# update: crea/actualiza las tablas a partir de las entidades sin borrar datos.
#   (usa create-drop si prefieres regenerarlas desde cero en cada arranque)
spring.jpa.hibernate.ddl-auto=update
# Ver el SQL que genera Hibernate en la consola (util para comprobar las tablas):
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Seguridad =====

# Nunca mandar el stack trace de Java en las respuestas de error (por defecto
# Spring Boot no lo manda, pero lo dejamos explicito para que quede claro y no
# se cuele nunca informacion interna -rutas, clases, versiones- a quien llame
# a la API).
spring.web.error.include-stacktrace=never

# En local lo dejamos en false para poder probar sin certificado. En
# produccion se pone a true para obligar a que TODO el trafico vaya por HTTPS.
app.security.require-https=false

# Datos del ADMIN que se crea automaticamente la primera vez que arranca la
# aplicacion (solo si la tabla trabajador esta vacia, ver AdminInicialRunner).
# Se pueden sobrescribir sin tocar este archivo con las variables de entorno
# ADMIN_EMAIL y ADMIN_PASSWORD. Cambia la contrasena en cuanto puedas entrar.
app.admin-inicial.email=${ADMIN_EMAIL:admin@imprenta.local}
app.admin-inicial.password=${ADMIN_PASSWORD:cambiaEstaClave123}
