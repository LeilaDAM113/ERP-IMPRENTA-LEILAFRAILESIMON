spring.application.name=ERP-Imprenta

# puerto del servidor
server.port=8080

# archivo con las contraseñas (no se sube a github)
spring.config.import=optional:file:./local.properties,optional:file:./backend/ERP-Imprenta/local.properties

# ===== Conexión a MySQL =====
# si la base de datos "sprinta" no existe, la crea
spring.datasource.url=jdbc:mysql://localhost:3306/sprinta?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
# la contraseña de MySQL esta en local.properties (o en la variable DB_PASSWORD)
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# update: crea las tablas solas a partir de las clases del model
spring.jpa.hibernate.ddl-auto=update
# saca por consola el SQL que se ejecuta
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Seguridad =====

# en los errores no se enseña el codigo por dentro
spring.web.error.include-stacktrace=never

# usar https: en mi ordenador en false, en un servidor de verdad en true
app.security.require-https=false

# primer admin, se crea si no hay ningun trabajador (AdminInicialRunner)
# hay que cambiarle la contraseña al entrar
app.admin-inicial.email=${ADMIN_EMAIL:admin@imprenta.local}
app.admin-inicial.password=${ADMIN_PASSWORD:cambiaEstaClave123}
# lo que dura el token en minutos (480 = 8 horas)
app.jwt.minutos-validez=480

