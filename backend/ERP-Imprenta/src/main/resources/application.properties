spring.application.name=ERP-Imprenta

# Puerto del servidor
server.port=8080

# Archivo local con las contraseñas (no se sube a GitHub)
spring.config.import=optional:file:./local.properties,optional:file:./backend/ERP-Imprenta/local.properties

# ===== Conexión a MySQL =====
# si la base de datos "sprinta" no existe, la crea
spring.datasource.url=jdbc:mysql://localhost:3306/sprinta?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
# la contraseña de MySQL esta en local.properties (o en la variable DB_PASSWORD)
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# update: crea y actualiza las tablas solas a partir de las clases del model, sin borrar datos
spring.jpa.hibernate.ddl-auto=update
# enseña en la consola el SQL que se ejecuta (para comprobar que va bien)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Seguridad =====

# en los errores no se enseñan detalles internos del codigo
spring.web.error.include-stacktrace=never

# obligar a usar HTTPS: en mi ordenador lo dejo en false, en un servidor real iria a true
app.security.require-https=false

# primer administrador, se crea solo si no hay ningun trabajador (ver AdminInicialRunner).
# hay que cambiarle la contraseña en cuanto se entre
app.admin-inicial.email=${ADMIN_EMAIL:admin@imprenta.local}
app.admin-inicial.password=${ADMIN_PASSWORD:cambiaEstaClave123}
# cuanto dura el token en minutos (480 = 8 horas, una jornada de trabajo)
app.jwt.minutos-validez=480

